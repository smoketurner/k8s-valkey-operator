name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the checkout; matches integration.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each suite under tests/ is a separate binary declared in Cargo.toml, and
      # `--test <name>` runs only that one; inline #[test] fns in src/ need --lib.
      # Running just `--test unit` executed 61 of ~660 tests, so the functional
      # state-machine suite and every inline test were never run on a PR.
      # Kept as separate steps so a failure names the suite that broke.
      # tests/integration is excluded: it is #[ignore]d and needs a live cluster.
      - name: Library tests
        run: cargo test --lib
      - name: Unit tests
        run: cargo test --test unit
      - name: Functional tests
        run: cargo test --test functional
      - name: Property tests
        run: cargo test --test proptest

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0
      - name: Helm Lint
        run: helm lint ./charts/valkey-operator
      - name: Helm Template
        run: helm template test-release ./charts/valkey-operator --kube-version 1.35.0 > /dev/null
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate CRDs with kubeconform
        run: |
          helm template test-release ./charts/valkey-operator --kube-version 1.35.0 | \
            kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary
